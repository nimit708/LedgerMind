version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd "CockroachDB hackathon/frontend" && npm ci
    build:
      commands:
        - cd "CockroachDB hackathon/frontend" && npm run build
  artifacts:
    baseDirectory: CockroachDB hackathon/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - CockroachDB hackathon/frontend/node_modules/**/*
